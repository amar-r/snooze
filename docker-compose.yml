# Builds the image from this checkout instead of pulling it, for working on
# SNOOZE itself. `compose.yaml` is the one to use for actually running it.
services:
  snooze:
    build: .
    container_name: snooze-dev
    restart: unless-stopped
    ports:
      - "8430:8430"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=8430
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8430/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
